version: '3.8'

services:

  # ─── CS2 Dedicated Server ──────────────────────────────────────────────────
  cs2:
    build: .
    container_name: cs2-server
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27020:27020/udp"   # GOTV (spectate)
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - STEAM_TOKEN=${STEAM_TOKEN}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=cs2user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=cs2server
    volumes:
      - cs2_data:/home/steam/cs2server   # dados persistentes do servidor
      - ./cfg:/home/steam/cs2server/game/csgo/cfg          # configs (hot reload)
      - ./plugins:/home/steam/cs2server/game/csgo/addons/counterstrikesharp/plugins
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cs2net

  # ─── MySQL (para WeaponPaints e MatchZy) ───────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cs2-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=cs2server
      - MYSQL_USER=cs2user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cs2net

  # ─── phpMyAdmin (interface web para o banco) ────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cs2-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=cs2user
      - PMA_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - cs2net

volumes:
  cs2_data:
  mysql_data:

networks:
  cs2net:
    driver: bridge
