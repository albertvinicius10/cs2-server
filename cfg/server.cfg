// ═══════════════════════════════════════════════════════
//   CS2 Dedicated Server — Configurações Gerais
//   Carregado automaticamente no startup
// ═══════════════════════════════════════════════════════

// ─── Modo de jogo ────────────────────────────────────
game_type       0
game_mode       1   // competitivo

// ─── Rounds ──────────────────────────────────────────
mp_maxrounds            24
mp_overtime_enable      1
mp_overtime_maxrounds   6
mp_overtime_startmoney  10000

// ─── Tempo (FACEIT-style) ────────────────────────────
mp_roundtime            1.92
mp_roundtime_defuse     1.92
mp_freezetime           15
mp_buytime              20
mp_buy_anywhere         0

// ─── Dinheiro ────────────────────────────────────────
mp_startmoney           800
mp_maxmoney             16000
mp_afterroundmoney      0

// ─── Bots ────────────────────────────────────────────
bot_quota               0
bot_quota_mode          normal

// ─── Misc ────────────────────────────────────────────
mp_friendlyfire         0
sv_cheats               0
sv_lan                  0
mp_death_drop_gun       1
mp_death_drop_defuser   1

// ─── Network (2 vCPU / WAN) ──────────────────────────
sv_minrate              196608
sv_maxrate              786432
sv_mincmdrate           64
sv_maxcmdrate           64
sv_maxupdaterate        64

echo "server.cfg executado"
