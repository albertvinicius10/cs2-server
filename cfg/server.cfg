// ═══════════════════════════════════════════════════════
//   CS2 - Configuração Competitiva 5x5
// ═══════════════════════════════════════════════════════

// ─── Identidade ──────────────────────────────────────
hostname        "Meu Servidor 5x5"
sv_password     ""

// ─── Rates (otimizado para CS2) ──────────────────────
sv_maxrate              786432
sv_maxupdaterate        128
sv_minupdaterate        64
sv_maxcmdrate           128
sv_mincmdrate           64
fps_max                 300

// ─── Segurança ───────────────────────────────────────
sv_cheats               0
sv_lan                  0
sv_pure                 1
sv_allow_votes          1

// ─── Bots ────────────────────────────────────────────
bot_quota               0
bot_join_after_player   0
bot_chatter             off

// ─── RCON (admin remoto) ─────────────────────────────
// rcon_password "suasenharcon"   // descomente e mude se quiser usar RCON

// ─── Logs ────────────────────────────────────────────
log                     on
sv_logbans              1
sv_logecho              1
sv_logfile              1
sv_log_onefile          0

// ─── GOTV (spectate) ─────────────────────────────────
tv_enable               1
tv_delay                30
tv_advertise_watchable  1
