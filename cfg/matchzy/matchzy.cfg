// ═══════════════════════════════════════════════════════
//   MatchZy - Configuração 5x5 Competitivo
// ═══════════════════════════════════════════════════════

// ─── Rounds ──────────────────────────────────────────
mp_maxrounds                    24      // 12 rounds cada lado
mp_overtime_enable              1
mp_overtime_maxrounds           6       // OT: 3 rounds cada lado
mp_overtime_startmoney          10000

// ─── Tempo ───────────────────────────────────────────
mp_roundtime                    1.92    // ~115 segundos
mp_roundtime_defuse             1.92
mp_freezetime                   15
mp_buytime                      20
mp_buy_anywhere                 0

// ─── Dinheiro ────────────────────────────────────────
mp_startmoney                   800
mp_maxmoney                     16000
mp_afterroundmoney              0

// ─── Morte e Dano ────────────────────────────────────
mp_death_drop_gun               1
mp_death_drop_defuser           1
ff_damage_reduction_bullets     0.33    // friendly fire reduzido

// ─── Voto e Pause ────────────────────────────────────
mp_pause_match_all_start        0       // !pause disponível para ambos
mp_technical_timeout_duration   120
mp_technical_timeout_per_team   1

// ─── Warmup ──────────────────────────────────────────
mp_warmuptime                   60
mp_warmup_pausetimer            0

// ─── MatchZy específico ──────────────────────────────
matchzy_autostart_mode          0       // 0 = manual, 1 = auto com jogadores suficientes
matchzy_minimum_ready_required  10      // todos os 10 devem dar !ready
matchzy_save_nades_as_global    0
matchzy_knife_enabled_for_unready_players 1
matchzy_chat_prefix             "[{DARKBLUE}MatchZy{DEFAULT}]"
